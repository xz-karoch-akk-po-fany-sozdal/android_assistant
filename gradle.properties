org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# OCR mode: "unbundled" (Google Play Services, default) or "bundled" (model inside APK).
# Override: gradle assembleRelease -PocrMode=bundled
ocrMode=unbundled
# ABIs: "arm64-v8a" (default). Example for both: -Pabis=arm64-v8a,armeabi-v7a
abis=arm64-v8a
